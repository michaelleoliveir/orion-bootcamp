  version: '3.8'

  services:
    api:
      build:
        context: .
        dockerfile: Dockerfile.dev
      ports:
        - "3000:3000"
      volumes:
        - ./app:/usr/src/app/app
        - /usr/src/app/node_modules
      env_file:
        - .env
      command: npm run dev
      depends_on:
        - db

    db:
      image: postgres:16
      env_file:
        - .env
      ports:
        - "5432:5432"
      volumes:
        - pgdata_dev:/var/lib/postgresql/data

  volumes:
    pgdata_dev:
